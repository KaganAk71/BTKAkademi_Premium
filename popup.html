<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>BTKAkademi Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080c16;
      --surface: rgba(18,25,45,0.75);
      --border: rgba(255,255,255,0.08);
      --primary: #8b5cf6;
      --primary-dim: rgba(139,92,246,0.18);
      --primary-glow: rgba(139,92,246,0.3);
      --green: #10b981;
      --green-dim: rgba(16,185,129,0.18);
      --text: #f1f5f9;
      --muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 340px;
      height: auto;
      min-height: 400px;
      max-height: 600px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      overflow-y: auto;
      overflow-x: hidden;
    }

    body { padding: 14px; display: flex; flex-direction: column; gap: 10px; }

    /* ── Header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 11px;
      border-bottom: 1px solid var(--border);
    }

    .brand { display: flex; align-items: center; gap: 9px; }

    .brand-logo {
      width: 30px; height: 30px; border-radius: 9px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      box-shadow: 0 0 14px var(--primary-glow);
      display: flex; align-items: center; justify-content: center;
    }

    .brand-title {
      font-size: 15px; font-weight: 800; letter-spacing: -0.4px;
      background: linear-gradient(90deg,#fff,#cbd5e1);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .badge-v {
      font-size: 10px; color: var(--primary);
      background: var(--primary-dim);
      padding: 2px 7px; border-radius: 100px; font-weight: 700;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 13px; padding: 13px;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 18px rgba(0,0,0,0.18);
    }

    .card-label {
      font-size: 10px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px;
    }

    /* ── Speed card ── */
    .speed-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }

    #speed-text {
      font-size: 22px; font-weight: 800;
      background: linear-gradient(90deg,#fff,#c4b5fd);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .speed-btns { display: flex; gap: 6px; }

    .icon-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.07);
      color: #94a3b8; border-radius: 8px;
      width: 32px; height: 30px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s; outline: none; flex-shrink: 0;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.14); color: #fff; transform: scale(1.07); }
    .icon-btn:active { transform: scale(0.96); }
    .icon-btn.primary { background: var(--primary-dim); color: var(--primary); border-color: rgba(139,92,246,0.2); }
    .icon-btn.primary:hover { background: rgba(139,92,246,0.32); }
    .icon-btn.green { background: var(--green-dim); color: var(--green); border-color: rgba(16,185,129,0.2); }
    .icon-btn.green:hover { background: rgba(16,185,129,0.32); }

    input[type="range"] {
      -webkit-appearance: none; width: 100%; height: 5px;
      background: rgba(255,255,255,0.1); border-radius: 100px; outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      background: var(--primary); border-radius: 50%;
      box-shadow: 0 0 8px var(--primary-glow); transition: transform .1s;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.25); }

    .presets {
      display: grid; grid-template-columns: repeat(4,1fr); gap: 5px; margin-top: 10px;
    }

    .preset-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.05);
      color: #94a3b8; padding: 6px 0; border-radius: 8px;
      font-size: 11px; font-weight: 600; cursor: pointer; transition: all .2s;
    }
    .preset-btn:hover, .preset-btn.active {
      background: var(--primary); color: #fff;
      box-shadow: 0 0 10px var(--primary-glow); border-color: transparent;
    }

    /* ── Action row (quick complete + screenshot) ── */
    .action-row {
      display: flex; gap: 6px; margin-top: 10px;
    }

    .action-btn {
      flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 0; border-radius: 9px; font-size: 12px; font-weight: 700;
      cursor: pointer; border: none; transition: all .2s; outline: none;
    }

    .action-btn.green {
      background: var(--green-dim); color: var(--green);
      border: 1px solid rgba(16,185,129,0.2);
    }
    .action-btn.green:hover { background: rgba(16,185,129,0.32); }

    .action-btn.purple {
      background: var(--primary-dim); color: var(--primary);
      border: 1px solid rgba(139,92,246,0.2);
    }
    .action-btn.purple:hover { background: rgba(139,92,246,0.32); }

    /* ── Downloader card ── */
    .dl-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

    .status-pill {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 100px;
    }
    .status-pill.waiting {
      background: rgba(245,158,11,0.14); border: 1px solid rgba(245,158,11,0.25); color: #f59e0b;
    }
    .status-pill.captured {
      background: rgba(16,185,129,0.14); border: 1px solid rgba(16,185,129,0.25); color: #10b981;
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0%  { box-shadow: 0 0 0 0 rgba(16,185,129,0.4); }
      70% { box-shadow: 0 0 0 7px rgba(16,185,129,0); }
      100%{ box-shadow: 0 0 0 0 rgba(16,185,129,0); }
    }

    .btn-open {
      background: linear-gradient(135deg,var(--primary),#6d28d9);
      border: none; color: #fff; padding: 8px 14px; border-radius: 9px;
      font-size: 11px; font-weight: 700; cursor: pointer; transition: all .2s;
      box-shadow: 0 2px 10px var(--primary-glow);
    }
    .btn-open:hover { transform: translateY(-1px); box-shadow: 0 4px 14px var(--primary-glow); }
    .btn-open:disabled { background: rgba(71,85,105,0.4); box-shadow: none; cursor: not-allowed; transform: none; }

    /* ── Shortcuts card ── */
    .sc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }

    .sc-item {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.04);
      padding: 5px 8px; border-radius: 7px; font-size: 10px; color: var(--muted);
      cursor: pointer; transition: border-color .2s;
    }
    .sc-item:hover { border-color: rgba(139,92,246,0.3); color: #c4b5fd; }

    kbd {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 4px; padding: 1px 6px; font-family: monospace; font-weight: 700;
      font-size: 11px; color: #fff; box-shadow: 0 1px 0 rgba(0,0,0,0.4);
      min-width: 22px; text-align: center;
    }

    .sc-edit-hint {
      font-size: 9px; color: var(--muted); margin-top: 7px; text-align: center; opacity: .7;
    }
  </style>
</head>

<body>
  <!-- Header -->
  <header>
    <div class="brand">
      <div class="brand-logo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      </div>
      <span class="brand-title">BTKAkademi Premium</span>
    </div>
    <span class="badge-v">v1.0</span>
  </header>

  <!-- Hız Kontrolü -->
  <div class="card">
    <div class="card-label">Video Hızı</div>
    <div class="speed-row">
      <span id="speed-text">1.00x</span>
      <div class="speed-btns">
        <button class="icon-btn" id="btn-speed-down" title="Hızı azalt">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="icon-btn" id="btn-speed-up" title="Hızı artır">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="icon-btn" id="btn-speed-reset" title="Hızı sıfırla (1x)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
        </button>
      </div>
    </div>
    <input type="range" id="speed-slider" min="0.25" max="16" step="0.25" value="1">
    <div class="presets">
      <button class="preset-btn active" data-speed="1">1x</button>
      <button class="preset-btn" data-speed="1.5">1.5x</button>
      <button class="preset-btn" data-speed="2">2x</button>
      <button class="preset-btn" data-speed="3">3x</button>
      <button class="preset-btn" data-speed="4">4x</button>
      <button class="preset-btn" data-speed="6">6x</button>
      <button class="preset-btn" data-speed="8">8x</button>
      <button class="preset-btn" data-speed="16">16x</button>
    </div>

    <!-- Quick actions -->
    <div class="action-row">
      <button class="action-btn green" id="btn-quick-complete">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        Hızlı Bitir
      </button>
      <button class="action-btn purple" id="btn-screenshot">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        SS Al
      </button>
    </div>
  </div>

  <!-- Medya İndirici -->
  <div class="card">
    <div class="card-label">Medya İndirici</div>
    <div class="dl-row">
      <div class="status-pill waiting" id="download-badge">
        <span style="font-size:12px">●</span> Video Bekleniyor
      </div>
      <button class="btn-open" id="btn-download-action" disabled>İndiriciyi Aç</button>
    </div>
  </div>

  <!-- Klavye Kısayolları -->
  <div class="card">
    <div class="card-label">Klavye Kısayolları</div>
    <div class="sc-grid" id="shortcuts-grid">
      <!-- filled by JS -->
    </div>
    <p class="sc-edit-hint">Alt bardaki ⚙ ile özelleştirebilirsiniz.</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
