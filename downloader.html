<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>BTK Akademi Premium Otonom Video İndirici</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #020617 100%);
      --card-bg: rgba(30, 41, 59, 0.45);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #8b5cf6;
      --primary-glow: rgba(139, 92, 246, 0.4);
      --secondary: #10b981;
      --secondary-glow: rgba(16, 185, 129, 0.3);
      --error: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 
                  0 0 40px rgba(139, 92, 246, 0.1);
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .container::before {
      content: '';
      position: absolute;
      top: -150px;
      right: -150px;
      width: 300px;
      height: 300px;
      background: var(--primary);
      filter: blur(120px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Üst Başlık Kısmı */
    header {
      position: relative;
      z-index: 1;
      margin-bottom: 30px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.25);
      color: #a78bfa;
      padding: 6px 16px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.1);
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background-color: var(--secondary);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--secondary);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.6; }
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #f8fafc, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* Yapılandırma Paneli */
    .config-panel {
      position: relative;
      z-index: 1;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      transition: all 0.3s;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 13px;
    }

    .info-label {
      color: var(--text-muted);
    }

    .info-value {
      font-weight: 600;
      color: var(--text-main);
      max-width: 70%;
      text-align: right;
      word-break: break-all;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    select, input[type="text"] {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
      width: 100%;
      cursor: pointer;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    /* İndirme Butonu */
    .btn-download {
      position: relative;
      z-index: 1;
      width: 100%;
      background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
      border: none;
      color: white;
      padding: 16px 32px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3),
                  inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(124, 58, 237, 0.5),
                  inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .btn-download:active {
      transform: translateY(1px);
    }

    .btn-download:disabled {
      background: rgba(71, 85, 105, 0.5);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* İlerleme Paneli */
    .progress-section {
      display: none;
      position: relative;
      z-index: 1;
      margin-top: 30px;
      animation: fadeIn 0.4s ease;
    }

    .progress-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .status-text {
      color: var(--text-main);
    }

    .percentage-text {
      color: var(--secondary);
    }

    .progress-container {
      width: 100%;
      height: 12px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 100px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 24px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #10b981 0%, #059669 100%);
      width: 0%;
      border-radius: 100px;
      box-shadow: 0 0 15px var(--secondary-glow);
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Log Konsolu */
    .log-panel {
      background: #020617;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 20px;
      height: 250px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8);
      scroll-behavior: smooth;
    }

    .log-panel::-webkit-scrollbar {
      width: 8px;
    }

    .log-panel::-webkit-scrollbar-track {
      background: transparent;
    }

    .log-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .log-panel::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .log-line {
      margin-bottom: 6px;
      display: flex;
      gap: 8px;
    }

    .log-time {
      color: #64748b;
      user-select: none;
    }

    .log-text {
      white-space: pre-wrap;
    }

    .log-info { color: #cbd5e1; }
    .log-success { color: #34d399; font-weight: 500; }
    .log-warning { color: #fbbf24; font-weight: 500; }
    .log-error { color: #f87171; font-weight: 500; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="badge">
        <span class="badge-dot"></span>
        BTK Otonom Dekoder
      </div>
      <h1>Akıllı Video Çözümleme İstasyonu</h1>
      <p class="subtitle">Ağ akışını dinler, AES-128 şifrelerini anında kırar ve kaliteden ödün vermeden MP4 paketler.</p>
    </header>

    <div class="config-panel">
      <div class="info-row">
        <span class="info-label">Kaynak Video URL</span>
        <span id="video-source" class="info-value">Bekleniyor...</span>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="quality-select">Yayın Çözünürlüğü</label>
          <select id="quality-select" disabled>
            <option value="">Analiz ediliyor...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="format-select">İndirme Formatı</label>
          <select id="format-select">
            <option value="mp4" selected>MP4 — Video (Önerilen)</option>
            <option value="ts">TS — Ham Akış</option>
            <option value="audio-wav">WAV — Sadece Ses</option>
          </select>
        </div>
      </div>
    </div>

    <button id="btn-start" class="btn-download" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      İndirme İşlemini Başlat
    </button>

    <div class="progress-section" id="progress-section">
      <div class="progress-stats">
        <span class="status-text" id="status-label">İndirme Hazırlanıyor...</span>
        <span class="percentage-text" id="progress-percentage">0%</span>
      </div>
      <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="log-panel" id="log-console">
        <!-- Log Satırları Dinamik Eklenecek -->
      </div>
    </div>
  </div>

  <script src="mux.min.js"></script>
  <script src="downloader.js"></script>
</body>
</html>
